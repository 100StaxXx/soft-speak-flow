    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/icon-192.png">

    <meta property="og:title" content="Graceward — Grow in faith, one day at a time" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Performance: DNS Prefetch & Preconnect for External Resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Warm editorial serif plus highly readable interface sans. -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  </head>

  <body>
    <!-- Debug indicator - shows if WebView loads but JS fails -->
    <div id="debug-indicator" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-size:24px;z-index:9999;background:#000;padding:20px;border-radius:10px;">
      Loading Graceward…
    </div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        document.getElementById('debug-indicator').innerHTML = 
          '<div style="background:red;padding:20px;border-radius:10px;">' +
          '<strong>JS Error:</strong><br>' + msg + '<br>Line: ' + line +
          '</div>';
        return false;
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
