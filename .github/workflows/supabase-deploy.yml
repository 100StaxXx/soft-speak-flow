name: Supabase Scoped Deploy

# Shared by Cosmiq and Graceward: never blanket-deploy on a source push.
on:
  workflow_dispatch:
    inputs:
      function_versions:
        description: 'Reviewed scope and live versions, e.g. {"companion-wellbeing-video":1}'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: shared-supabase-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run deadcode:check
      - run: npm audit --audit-level=moderate
      - run: npm run test:run
      - run: node --test scripts/validate-scoped-release.test.mjs
      - run: npm run functions:typecheck && npm run functions:test
      - run: npm run test:migrations:static && npm run manifest:check
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      - name: Verify live versions and deploy only reviewed functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          FUNCTION_VERSIONS: ${{ inputs.function_versions }}
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = "opbfpbbqvuksuvmtmssd"
          supabase functions list --project-ref "$PROJECT_REF" -o json > /tmp/live-functions.json
          node scripts/validate-scoped-release.mjs /tmp/live-functions.json > /tmp/reviewed-functions.txt
          while IFS= read -r fn; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done < /tmp/reviewed-functions.txt
          supabase functions list --project-ref "$PROJECT_REF" -o json
      # Database and auth settings need a separate reviewed rollout. Never run
      # config push, migration repair, or db push --include-all here.
